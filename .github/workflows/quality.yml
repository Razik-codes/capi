name: Quality checks

on:
  push:
  pull_request:

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run fast repository checks
        run: python -m unittest discover -s tests

      - name: Compile validation scripts
        run: python -m py_compile scripts/check_environment.py scripts/validate_pretrained.py
